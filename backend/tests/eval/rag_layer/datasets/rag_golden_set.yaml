# RAG 检索层评测标注集，供 test_retrieval_quality.py 消费。
# 格式对应 backend/docs/rag模块评测方案.md §4.3 的设计，按业务 case 分组：
# 一个 case = 一个真实场景 + N 个真实/仿真 query 变体，共享同一批标准 chunk_id。
#
# standard_chunk_ids：命中即算召回成功的必要证据 chunk。
# distractor_chunk_ids：容易被误判为命中的相邻/同主题 chunk（仅供人工核对，不参与自动判定，
#   因为判定逻辑只看 standard_chunk_ids 是否出现，distractor 天然不会被误计为命中）。
# min_top3_hit_ratio：5 个 query 变体里至少要有多少比例在重排后进入 Top3。
cases:
  - id: rag_case_001_dhu_tuition
    university_name: 东华大学
    university_code: "10255"
    document_type: charter
    document_year: 2026
    source_url: "https://zs.dhu.edu.cn/2026/0528/c9563a376561/page.htm"
    query: "东华大学2026年本科各专业学费标准是多少？"
    query_variants:
      - "东华大学学费一年多少钱？"
      - "这个学校不同专业学费有区别吗？"
      - "2026年本科学费标准"
      - "服装设计中外合作一年多少钱？"
    # 2026-08-30 chunking 逻辑重构（导航噪声过滤 + 上下文保留关键词过滤 + 分级预算/overlap）
    # 后全库重新切分，chunk_id 全部重新生成。这条 case 本身标注的就是重构前的真实线上
    # bug（"1.学费标准"标题和具体金额被硬切进两个不同 chunk，标题所在 chunk 单独召回时
    # 没有金额信息）——重切分后第二十一条整条（含标题和金额）已经落在同一个 chunk 里，
    # 原来的 distractor chunk 不再作为独立实体存在，因此这里不再需要 distractor_chunk_ids。
    # 两个 chunk 都算命中：overlap 会让"学费标准"条款的完整内容（含子项1-4）横跨
    # 相邻两个 chunk 各自完整出现一部分（一个带子项1的文理科基准价，一个带子项2-4
    # 的艺术类/中外合作/理科试验班价格，因为overlap把子项2-4的内容复制到了下一个
    # chunk），两者都是真实、可独立回答部分学费问题的证据，不是"一个对一个错"。
    standard_chunk_ids:
      - "3b0f993c-b17a-4b12-8f36-87bd03124897"
      - "22f1a78d-03e0-4a45-9bb1-5f450cf02fe8"
    min_top3_hit_ratio: 0.8
