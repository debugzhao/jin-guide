province: 浙江
# 白名单口径：艾瑞深校友会网《2025校友会中国大学排名》（2025-01-10发布）浙江省内
# 普通本科高校子榜单前10（不含独立学院/高职/民办附属学院）。与江苏不同，浙江省内
# 除浙江大学外基本没有教育部直属985/211高校，其余均为省属/省市共建，属性判定见下方
# 各校注释。此白名单为开发期间冻结的v1，需产品最终确认，不是动态排名结果（同江苏
# jiangsu.yaml的约定）。
target_universities:
  - university_code: "10335"
    name: 浙江大学
    city: 杭州
    ownership: central
    admissions_url: https://zdzsc.zju.edu.cn/
  - university_code: "11646"
    name: 宁波大学
    city: 宁波
    ownership: provincial
    admissions_url: https://zsb.nbu.edu.cn/
  - university_code: "10337"
    name: 浙江工业大学
    city: 杭州
    ownership: provincial
    admissions_url: https://zs.zjut.edu.cn/html/index.html
  - university_code: "10345"
    name: 浙江师范大学
    city: 金华
    ownership: provincial
    admissions_url: https://zs.zjnu.edu.cn/
  # 西湖大学：教育部批复定性为"社会力量举办、国家重点支持的非营利新型高等学校"，
  # 阳光高考等第三方平台标注办学性质为"民办"——不是本配置ownership字段现有的
  # central/provincial二值之一，此处留空而不是编造，采集/发布时需单独处理（详见
  # backend/data_pipeline/docs/10_zhejiang_top10_data_collection_status.md）。
  - university_code: "14626"
    name: 西湖大学
    city: 杭州
    ownership: null
    admissions_url: https://zh-ugadmissions.westlake.edu.cn/
  - university_code: "10338"
    name: 浙江理工大学
    city: 杭州
    ownership: provincial
    admissions_url: https://zs.zstu.edu.cn/
  - university_code: "10353"
    name: 浙江工商大学
    city: 杭州
    ownership: provincial
    admissions_url: https://zhaoban.zjgsu.edu.cn/
  - university_code: "10336"
    name: 杭州电子科技大学
    city: 杭州
    ownership: provincial
    admissions_url: https://zhaosheng.hdu.edu.cn/
  # 杭州师范大学：举办方为杭州市人民政府（"省市共建、以杭州市管理为主"），严格意义
  # 上更接近市属，但行业内通常仍归为省属高校序列，暂标provincial，详见状态看板。
  - university_code: "10346"
    name: 杭州师范大学
    city: 杭州
    ownership: provincial
    admissions_url: http://undergrad.hznu.edu.cn/
  - university_code: "10343"
    name: 温州医科大学
    city: 温州
    ownership: provincial
    admissions_url: https://zhaosheng.wmu.edu.cn/

# 浙江省教育考试院官网为 www.zjzs.net（已核实，非江苏 jseea.cn）。浙江不分文理，
# 官方文件用"总分分数段表"对应江苏的"逐分段表"；投档线按"第一段/第二段"两次划线
# 各发一篇，不是江苏按物理/历史两科类各发一篇——subject_type在这些source上应产出
# "unified"（§3已支持），"第一段/第二段"暂计划落进AdmissionScoreRecord.batch字段
# （如"第一段"/"第二段"），实际映射方式留给Implement阶段用真实数据验证，此处只登记
# 入口不预判解析细节。
sources:
  - id: zjzs-policy-2026
    name: 中共浙江省委教育工作领导小组秘书组关于做好2026年普通高校招生工作的通知
    entry_url: https://www.zjzs.net/art/2026/5/20/art_45_12293.html
    data_type: policy
    year: 2026
    parser: policy_document_v1
    update_frequency: yearly
    discovery_title_pattern: 普通高校招生工作实施方案.*(docx|doc|pdf)
    discovery_depth: 1
  - id: zjzs-policy-2025
    name: 中共浙江省委教育工作领导小组秘书组关于做好2025年普通高校招生工作的通知
    entry_url: https://www.zjzs.net/art/2025/5/7/art_156_11112.html
    data_type: policy
    year: 2025
    parser: policy_document_v1
    update_frequency: yearly
    discovery_title_pattern: 普通高校招生工作实施方案.*(docx|doc|pdf)
    discovery_depth: 1
  - id: zjzs-rank-segment-2026
    name: 浙江省2026年普通高校招生成绩分数段表（总分）
    entry_url: https://www.zjzs.net/art/2026/6/26/art_45_12452.html
    data_type: rank_segment
    year: 2026
    parser: zjzs_rank_segment_v1
    update_frequency: yearly
    discovery_title_pattern: 分数段表.*(总分)?.*(pdf|xls|xlsx)
    discovery_depth: 1
  - id: zjzs-rank-segment-2025
    name: 浙江省2025年普通高校招生成绩分数段表（总分）
    entry_url: https://www.zjzs.net/art/2025/6/25/art_45_11373.html
    data_type: rank_segment
    year: 2025
    parser: zjzs_rank_segment_v1
    update_frequency: yearly
    discovery_title_pattern: 分数段表.*(总分)?.*(pdf|xls|xlsx)
