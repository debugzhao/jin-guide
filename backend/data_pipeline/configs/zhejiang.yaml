  - id: zjzs-admission-score-2026-stage1
    name: 浙江省2026年普通高校招生普通类第一段平行投档分数线
    entry_url: https://www.zjzs.net/art/2026/7/21/art_45_12550.html
    data_type: admission_score
    year: 2026
    parser: zjzs_admission_score_v1
    update_frequency: yearly
    discovery_title_pattern: 第一段平行投档分数线.*(xls|xlsx|pdf)
    discovery_depth: 1
