    year: 2026
    parser: zjzs_admission_score_v1
    update_frequency: yearly
    discovery_title_pattern: 第二段平行投档分数线.*(xls|xlsx|pdf)
    discovery_depth: 1
  - id: zjzs-admission-score-2025-stage1
    name: 浙江省2025年普通高校招生普通类第一段平行投档分数线表
    entry_url: https://www.zjzs.net/art/2025/7/21/art_45_11467.html
