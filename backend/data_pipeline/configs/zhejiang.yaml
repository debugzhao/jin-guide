  # 10校2026年招生计划：只登记确认过"页面本身承载真实数据/入口"的5校，其余5校
  # （浙大/西湖大学无官网承载页、杭电/浙师大未定位到2026年具体条目、温州医科大学
  # 数据实际发布在微信公众号文章）暂不登记，避免塞入未核实URL，详见状态看板§4。
  - id: nbu-admission-plan-2026
    name: 宁波大学2026年浙江省招生计划
    entry_url: https://zsb.nbu.edu.cn/info/1012/4176.htm
    data_type: admission_plan
    year: 2026
    target_university_code: "11646"
    collection_method: http
    parser: tabular_html_v1
    update_frequency: yearly
    # 数据直接嵌在入口页自己的<table>里，不是链接到的附件，不需要发现子链接——
    # 曾经用默认discovery_depth=1时，因为没设discovery_title_pattern，把整站导航
    # （联系我们/学院介绍等22个不相关页面，甚至外链到gaokao.chsi.com.cn触发412）
    # 都当成"可能的附件"抓了一遍，改成0之后只拉入口页本身。
    discovery_depth: 0
  - id: zjut-admission-plan-2026
    name: 浙江工业大学2026年招生计划（分省分专业）
    entry_url: https://zs.zjut.edu.cn/html/w26_1.html
    data_type: admission_plan
    year: 2026
    target_university_code: "10337"
    # 列表页链接（jsp/news.jsp?neId=2569）本身是个JS重定向壳（"top.window.location=
    # ...n2569.html"），httpx不执行JS只能拿到935字节的壳；跟进去后的真实文章页
    # (html/n2569.html)也确认了：唯一的两个<table>都是导航/页脚装饰表，真正的
    # 招生计划数据挂在#news1content这个容器里，内容由前端JS异步渲染，静态HTML里
    # 是空的——已用真实curl响应验证过，不是discovery_title_pattern没配对，是这
    # 条链路本身需要能执行JS的浏览器，改成manual走Playwright人工辅助路径。
    collection_method: manual
    parser: manual_playwright_v1
    update_frequency: yearly
  - id: zstu-admission-plan-2026
    name: 浙江理工大学2026年招生计划（分省）
    entry_url: https://zs.zstu.edu.cn/zsjh.htm
    data_type: admission_plan
    year: 2026
    target_university_code: "10338"
    collection_method: http
    parser: manual_playwright_v1
    update_frequency: yearly
    # 学校自己名字就带"浙江"两个字，之前只写"浙江"会把18个省份的分省计划链接全部
    # 匹配上（每条链接文字都是"浙江理工大学2026年分省招生计划（XX省）"），已用真实
    # 页面验证过这个坑——必须精确到"分省招生计划（浙江）"这个带括号的完整短语，
    # 才能只锁定目标省份自己那一条，排除掉其余17个省份的链接
    discovery_title_pattern: 分省招生计划（浙江）
    discovery_depth: 1
  - id: hznu-admission-plan-2026
    name: 杭州师范大学2026年省级招生计划
    entry_url: https://undergrad.hznu.edu.cn/zsjh_2.html
    data_type: admission_plan
    year: 2026
    target_university_code: "10346"
    collection_method: http
    parser: manual_playwright_v1
    update_frequency: yearly
    # 真实链路是"列表页→年份详情页→PDF附件"两跳，depth=1只能到详情页，需要2；
    # 同一个discovery_title_pattern要同时匹配两跳的链接文字："列表页→详情页"这一跳
    # 链接文字是"2026年浙江省招生计划"，"详情页→PDF"这一跳是"2026年浙江省普通计划"
    # （详情页上还同时挂着艺体类/三位一体/地方专项/中本一体化4个特殊招生机制的PDF，
    # 跟admission_plan语义对不上，故意不匹配，见状态看板）
    discovery_title_pattern: 2026年浙江省(招生计划|普通计划)
    discovery_depth: 2
