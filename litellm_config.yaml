model_list:
  # 轻量模型：Profile Agent、Retrieval Agent（query rewrite）
  - model_name: profile-agent
    litellm_params:
      model: openai/kimi-k2.6
      api_base: os.environ/MOONSHOT_BASE_URL
      api_key: os.environ/MOONSHOT_API_KEY

  - model_name: retrieval-agent
    litellm_params:
      model: openai/kimi-k2.6
      api_base: os.environ/MOONSHOT_BASE_URL
      api_key: os.environ/MOONSHOT_API_KEY

  # Chat-first 建档前聊天（IntakeAgent，带 function calling，独立观测/成本口径）
  - model_name: intake-agent
    litellm_params:
      model: openai/kimi-k2.6
      api_base: os.environ/MOONSHOT_BASE_URL
      api_key: os.environ/MOONSHOT_API_KEY

  # 主力模型：Report Agent、Reflection Agent、人工复核底稿
  - model_name: report-agent
    litellm_params:
      model: openai/kimi-k2.6
      api_base: os.environ/MOONSHOT_BASE_URL
      api_key: os.environ/MOONSHOT_API_KEY

  - model_name: reflection-agent
    litellm_params:
      model: openai/kimi-k2.6
      api_base: os.environ/MOONSHOT_BASE_URL
      api_key: os.environ/MOONSHOT_API_KEY

  - model_name: review-draft-agent
    litellm_params:
      model: openai/kimi-k2.6
      api_base: os.environ/MOONSHOT_BASE_URL
      api_key: os.environ/MOONSHOT_API_KEY

  # Embedding（DashScope qwen3.7-text-embedding，兼容 OpenAI embedding 接口；
  # Moonshot moonshot-v1-emb-small 返回 403 且官方文档查无此模型，已废弃，
  # 见 backend/docs/04_rag_pipeline.md §9）
  - model_name: text-embedding-3-small
    litellm_params:
      model: openai/qwen3.7-text-embedding
      api_base: os.environ/DASHSCOPE_EMBEDDING_BASE_URL
      api_key: os.environ/DASHSCOPE_API_KEY

router_settings:
  routing_strategy: simple-shuffle
  fallbacks:
    - report-agent: [reflection-agent]
    - reflection-agent: [report-agent]
    - profile-agent: [retrieval-agent]
    - retrieval-agent: [profile-agent]
    - intake-agent: [profile-agent]

litellm_settings:
  success_callback: ["langsmith"]
  failure_callback: ["langsmith"]
  max_budget: 20.0
  budget_duration: "1d"
  drop_params: true
  set_verbose: false
  request_timeout: 60
